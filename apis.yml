name: Volt
description: >-
  Volt is a desktop application (Mac, Windows, and Chrome) that supercharges
  WhatsApp for professionals and sales teams — turning long voice notes into
  readable transcripts and summaries, scheduling messages, adding keyboard-first
  navigation, organizing chats into focused workspaces, and sending personalized
  broadcasts. Message content stays under WhatsApp's end-to-end encryption and
  never passes through Volt's own servers. For agents and AI models, Volt runs an
  authenticated remote Model Context Protocol (MCP) server that exposes WhatsApp
  contacts, chats, messages, groups, and lists as tools. Volt is backed by 500
  Global, EQT Ventures, and IVP.
